name: Tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TOKENIZERS_PARALLELISM: "false"
      USE_TF: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NandhaKishorM/laya
          ref: 1adc59f7e371deb601fcfa18a14e25db238addcc
          path: .upstream
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[convert,dev,demo,publish,reference]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
