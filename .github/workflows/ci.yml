name: Tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TOKENIZERS_PARALLELISM: "false"
      USE_TF: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NandhaKishorM/laya
          ref: fe9a6c35023a7d94102e7feaaeaae8857d9d1b07
          path: .upstream
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[convert,dev,demo,publish,reference,serve,mcp,structured,llamaindex]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/audit_public_api.py --package laya_coreml
      - run: git diff --exit-code -- docs/UPSTREAM_0417_API_AUDIT.json
      - run: python -u -X faulthandler -m pytest -vv -s
      - name: Show native crash reports
        if: failure() && runner.os == 'macOS'
        run: |
          python - <<'PY'
          import time
          from pathlib import Path
          time.sleep(3)
          for folder in (Path.home() / "Library/Logs/DiagnosticReports", Path("/Library/Logs/DiagnosticReports")):
              for path in sorted(folder.glob("*.ips"))[-3:]:
                  print(path.name)
                  print(path.read_text()[:60000])
          PY
      - run: python -m build
      - run: python -m twine check --strict dist/*
