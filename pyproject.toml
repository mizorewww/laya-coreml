[build-system]
# Keep Core Metadata 2.4 compatibility with the validated Twine 6 release path.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "laya-coreml"
version = "0.4.0"
description = "Local Laya typed decisions on Apple Core ML and Neural Engine, with a live Snake demo"
keywords = ["coreml", "neural-engine", "laya", "decision-model", "apple-silicon", "local-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["coremltools>=9,<10", "numpy>=1.26,<2.2", "tokenizers>=0.21,<1", "huggingface-hub>=0.34,<2", "safetensors>=0.6"]

[project.optional-dependencies]
serve = ["fastapi>=0.110.0", "uvicorn>=0.27.0", "httpx>=0.27.0"]
mcp = ["mcp>=2.2.0"]
structured = ["pydantic>=2"]
calibration = ["torch==2.7.0"]
langchain = ["langchain-core>=0.2.0", "langgraph>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]
crewai = ["crewai>=0.28.0"]
convert = ["torch==2.7.0", "safetensors>=0.6"]
dev = ["pytest>=8", "ruff>=0.12", "build>=1", "psutil>=6"]
compare = ["laya-mlx==0.2.0"]
research = ["kmeans1d==0.4.0"]
demo = ["rich>=15,<16", "Pillow>=12,<13"]
reference = ["transformers>=5,<6"]
publish = ["twine>=6,<7"]

[project.scripts]
laya-coreml-router = "laya_coreml.router_cli:main"
laya-coreml-serve = "laya_coreml.serve:main"
laya-coreml-evals = "laya_coreml.evals_cli:main"
laya-coreml-mcp-server = "laya_coreml.mcp.server:main"
laya-coreml = "laya_coreml.cli:main"
laya-coreml-snake = "laya_coreml.snake.cli:main"

[project.urls]
Repository = "https://github.com/mizorewww/laya-coreml"
Upstream = "https://github.com/NandhaKishorM/laya"
Documentation = "https://github.com/mizorewww/laya-coreml#readme"
Issues = "https://github.com/mizorewww/laya-coreml/issues"
Benchmarks = "https://github.com/mizorewww/laya-coreml/blob/main/docs/ANE_BENCHMARKS.md"

[tool.hatch.build.targets.wheel]
packages = ["laya_coreml"]

[tool.hatch.build.targets.sdist]
include = ["/laya_coreml", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
# CrewAI's instructor requires Rich <15; the existing Snake demo uses Rich 15.
conflicts = [[{ extra = "crewai" }, { extra = "demo" }]]
